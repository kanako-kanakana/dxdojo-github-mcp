<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水曜のDX道場 — GitHub MCP ハンズオン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #f7fbff;
      color: #243447;
    }

    .card {
      background: #ffffff;
      border: 1px solid #dbeafe;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.12);
    }

    .label {
      color: #2563eb;
    }

    h1 {
      color: #1d4ed8;
    }

    .lead {
      color: #475569;
    }

    .edit-me {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    #message {
      color: #1e40af;
    }

    .badge {
      background: #dbeafe;
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">水曜のDX道場</p>
    <h1>GitHub MCP ハンズオン</h1>
    <p class="lead">
      このページは <strong>GitHub Actions</strong> によって自動デプロイされています。<br>
      <code>main</code> ブランチに push されると、数十秒後にこのページが更新されます。
    </p>

    <!-- ▼▼▼ ハンズオンではここを編集します ▼▼▼ -->
    <section class="edit-me">
      <h2>参加者メッセージ</h2>
      <p id="message">Hello Github MCP〜</p>
    </section>
    <!-- ▲▲▲ ハンズオンではここを編集します ▲▲▲ -->

    <footer>
      <p>デプロイ回数: <span class="badge">v1</span></p>
    </footer>
  </main>
</body>
</html>
